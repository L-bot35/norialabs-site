<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NORIA LABS</title>
  <meta name="description" content="NORIA LABS — productos digitales y herramientas prácticas para trabajar con más claridad.">
  <style>
    :root{--bg:#f5f2ec;--ink:#102027;--teal:#0f4656;--orange:#eb6b25;--muted:#66767c}
    *{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
    main{min-height:100vh;display:grid;place-items:center;padding:32px}
    .card{width:min(820px,100%);text-align:center}
    .logo{width:min(420px,80%);margin:0 auto 36px}
    h1{font-size:clamp(36px,7vw,70px);line-height:1.02;margin:0 0 18px;color:var(--teal)}
    p{font-size:18px;line-height:1.65;color:var(--muted);max-width:650px;margin:0 auto 28px}
    a{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 24px;border-radius:14px;background:var(--orange);color:#fff;text-decoration:none;font-weight:700}
    small{display:block;margin-top:26px;color:var(--muted)}
  </style>
</head>
<body>
  <main>
    <section class="card">
      <img class="logo" src="assets/noria-labs-logo.png" alt="Noria Labs">
      <h1>Herramientas digitales para trabajar con más claridad.</h1>
      <p>Estamos preparando el sitio oficial de NORIA LABS. Mientras tanto, ya puedes conocer nuestro primer producto: Presupuesto Rápido PRO.</p>
      <a href="presupuesto-pro/">Conocer Presupuesto Rápido PRO</a>
      <small>© 2026 NORIA LABS</small>
    </section>
  </main>
</body>
</html>
